server:
  port: 8804

spring:
  application:
    name: services-product1
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        import-check:
          enabled: false
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
      discovery:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
    sentinel:
      transport:
        dashboard: localhost:8080
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shopping?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # Redis 缓存（本地）：商品详情/分类/品牌热点数据
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 1000ms
      # 说明：Lettuce 默认基于 Netty 共享单连接（多路复用）即可支撑并发；
      # 如需配置 lettuce.pool 连接池，必须额外引入 org.apache.commons:commons-pool2 依赖，否则启动报错。

# 开启 Sentinel 对 Feign 的熔断降级支持，使 @FeignClient(fallback=...) 生效
feign:
  sentinel:
    enabled: true

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
