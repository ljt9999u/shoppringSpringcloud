server:
  port: 8804

spring:
  application:
    name: services-product1
  # 图片上传大小限制（前端中转上传，最大 5MB）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        import-check:
          enabled: false
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
      discovery:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
    sentinel:
      transport:
        dashboard: localhost:8080
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shopping?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # Redis 缓存（本地）：商品详情/分类/品牌热点数据
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 1000ms
      # 说明：Lettuce 默认基于 Netty 共享单连接（多路复用）即可支撑并发；
      # 如需配置 lettuce.pool 连接池，必须额外引入 org.apache.commons:commons-pool2 依赖，否则启动报错。

# 开启 Sentinel 对 Feign 的熔断降级支持，使 @FeignClient(fallback=...) 生效
feign:
  sentinel:
    enabled: true

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置：MyBatis SQL 日志设为 WARN，避免高并发下打印大量 SQL/结果集造成内存与性能压力
logging:
  level:
    org.example.Mapper: WARN

# 腾讯云 CloudBase（云开发）配置
# 已改用后端中转上传（upload.dir），此配置保留仅作参考
cloudbase:
  env-id: demo2-4gx58pwtb0429fb1

# 图片上传保存目录（后端中转方案）
upload:
  dir: D:/weifuwu/demo2/uploads

# ========== Seata 分布式事务（AT 模式，RM 角色：扣库存分支） ==========
# enabled=false：未部署 seata-server 时关闭，不影响服务启动与现有流程；
# TC 启动并注册 Nacos 后改为 true，本服务的 reduceStock 将随订单服务的全局事务一起提交/回滚
seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: shopping_tx_group
  service:
    vgroup-mapping:
      shopping_tx_group: default
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.28.1:8848
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: 192.168.28.1:8848
      namespace: ""
      group: SEATA_GROUP
