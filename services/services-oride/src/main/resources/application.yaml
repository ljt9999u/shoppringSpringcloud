spring:
  application:
    name: services-oride
  config:
    import:
      - optional:service-orider.properties
      - optional:classpath:alipay-secret.yml
  cloud:
    nacos:
      username: nacos
      password: nacos
      config:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        file-extension: properties
        group: DEFAULT_GROUP
        refresh-enabled: true
        import-check:
          enabled: false
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
      discovery:
        server-addr: 192.168.28.1:8848
        username: ${spring.cloud.nacos.username}
        password: ${spring.cloud.nacos.password}
        access-key: ${spring.cloud.nacos.username}
        secret-key: ${spring.cloud.nacos.password}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 2000
          services-product1:
            loggerLevel: full
            connectTimeout: 3000
            readTimeout: 5000
  # 数据库配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shopping?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# 开启 Sentinel 对 Feign 的熔断降级，使 @FeignClient(fallback=...) 在下游服务故障/超时时生效
feign:
  sentinel:
    enabled: true

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

#oride:
#  timeout: 300000
#  auto-confirm: 70

oride:
  timeout: default-30min
  auto-confirm: default-7d

# 支付宝沙箱配置（敏感参数放在 alipay-secret.yml，已 gitignore，不入库）
alipay:
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 支付结果异步回调地址：必须公网可访问，本地开发请用内网穿透（cpolar/natapp）替换域名
  notify-url: http://你的公网地址/api/oride/pay/alipay/notify
  # 支付完成后浏览器跳转地址（前端页面，必须 https 与 dev server 协议一致）
  return-url: https://localhost:5173/pay/result
  sign-type: RSA2
  charset: utf-8
  format: json
#配置feign的日志级别
logging:
  level:
    org.example.Feign.GaoDefeign: DEBUG
    feign: DEBUG
    # MyBatis SQL 日志设为 WARN，避免高并发下打印大量 SQL/结果集造成内存与性能压力
    org.example.Mapper: WARN

server:
  port: 8004

# ========== Seata 分布式事务（AT 模式） ==========
# enabled=false：未部署 seata-server 时关闭，@GlobalTransactional 不生效，自动退化为本地 @Transactional；
# 部署 seata-server 2.x 并注册到 Nacos 后，把 enabled 改为 true 即启用"下单扣库存"跨服务强一致
seata:
  enabled: false
  application-id: ${spring.application.name}
  # 事务分组：客户端通过分组名映射到 TC 集群（vgroup-mapping）
  tx-service-group: shopping_tx_group
  service:
    vgroup-mapping:
      shopping_tx_group: default
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.28.1:8848
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: 192.168.28.1:8848
      namespace: ""
      group: SEATA_GROUP
